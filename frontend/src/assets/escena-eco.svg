    <g transform="translate(486,232)">
      <path d="M0,0 C-13,0 -22,-11 -22,-24 C-22,-38 -11,-48 0,-48 C11,-48 22,-38 22,-24 C22,-11 13,0 0,0 Z" fill="#22d3ee"/>
