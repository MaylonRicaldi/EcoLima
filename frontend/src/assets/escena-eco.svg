  </g>

  <!-- arboles -->
  <g>
    <g transform="translate(96,398)">
      <rect x="-5" y="10" width="10" height="26" rx="4" fill="#7a5230"/>
      <circle cx="0" cy="-6" r="26" fill="#1d8a6d"/>
      <circle cx="-16" cy="8" r="17" fill="#2fa383"/>
      <circle cx="16" cy="8" r="17" fill="#2fa383"/>
    </g>
    <g transform="translate(170,424) scale(0.78)">
      <rect x="-5" y="10" width="10" height="26" rx="4" fill="#7a5230"/>
      <circle cx="0" cy="-6" r="26" fill="#1d8a6d"/>
      <circle cx="-16" cy="8" r="17" fill="#2fa383"/>
      <circle cx="16" cy="8" r="17" fill="#2fa383"/>
    </g>
    <g transform="translate(716,404) scale(0.9)">
      <rect x="-5" y="10" width="10" height="26" rx="4" fill="#7a5230"/>
      <circle cx="0" cy="-6" r="26" fill="#1d8a6d"/>
      <circle cx="-16" cy="8" r="17" fill="#2fa383"/>
      <circle cx="16" cy="8" r="17" fill="#2fa383"/>
    </g>
  </g>

  <!-- camion -->
  <g transform="translate(236,406)">
    <rect x="0" y="-44" width="76" height="48" rx="9" fill="url(#camion)"/>
    <path d="M76,-30 L102,-30 L118,-14 L118,-4 L76,-4 Z" fill="#0ea5a0"/>
    <rect x="82" y="-26" width="24" height="14" rx="5" fill="#d9f2f4" opacity="0.9"/>
    <circle cx="24" cy="10" r="14" fill="#0b3b31"/>
    <circle cx="24" cy="10" r="6" fill="#cfe9e4"/>
    <circle cx="96" cy="10" r="14" fill="#0b3b31"/>
    <circle cx="96" cy="10" r="6" fill="#cfe9e4"/>
    <path d="M8,-38 h44 a5,5 0 0 1 5,5 v6 a5,5 0 0 1 -5,5 h-44 a5,5 0 0 1 -5,-5 v-6 a5,5 0 0 1 5,-5 Z" fill="#ffffff" opacity="0.9"/>
    <text x="32" y="-20" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#0f6b53" text-anchor="middle">CO₂</text>
  </g>

  <!-- suelo -->
  <path d="M0,452 C120,432 210,466 320,452 C430,438 520,468 630,452 C706,442 760,452 800,448 L800,500 L0,500 Z" fill="url(#suelo)"/>
</svg>