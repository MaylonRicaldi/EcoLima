name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify frontend
        run: |
          curl --fail --show-error --location --retry 5 \
            --retry-delay 10 \
            https://ecolima-frontend-seven.vercel.app/
      - name: Verify backend health
        run: |
          curl --fail --show-error --location --retry 5 \
            --retry-delay 10 \
            https://ecolima-backend.onrender.com/health
