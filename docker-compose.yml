version: "3.9"
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: ecologistica-lima-db-1
    environment:
      POSTGRES_USER: ecologistica
      POSTGRES_PASSWORD: ecologistica
      POSTGRES_DB: ecologistica_lima
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecologistica -d ecologistica_lima"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ecolima_backend
    environment:
      DATABASE_URL: postgresql://ecologistica:ecologistica@db:5432/ecologistica_lima
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app

volumes:
  pgdata:
